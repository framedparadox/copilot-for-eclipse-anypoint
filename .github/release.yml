changelog:
  exclude:
    labels:
      - ignore-for-release
      - dependencies
    authors:
      - dependabot
      - github-actions
  categories:
    - title: "🚀 Features"
      labels:
        - feature
        - enhancement
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "📝 Documentation"
      labels:
        - documentation
        - docs
    - title: "🧹 Maintenance"
      labels:
        - chore
        - refactor
        - cleanup
    - title: "⬆️ Dependencies"
      labels:
        - dependencies
    - title: "Other Changes"
      labels:
        - "*"
