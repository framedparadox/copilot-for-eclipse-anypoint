name: Build and Package (p2 ZIP)

on:
  push:
    branches: [ build, dev/anypoint-studio ]
  workflow_dispatch:

env:
  MAVEN_OPTS: -Xmx2g

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract plugin version
        run: |
          VERSION=$(grep -oP '(?<=<copilot-plugin-version>)[^<]+' pom.xml)
          echo "COPILOT_PLUGIN_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'

      - name: Cache Maven local repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Copilot agent
        working-directory: com.microsoft.copilot.eclipse.core/copilot-agent
        run: |
          npm install --force
          cp -r node_modules/@github/copilot-language-server/dist ./dist

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Build (Tycho/Maven)
        run: |
          ./mvnw -DskipTests -Dcheckstyle.skip=true clean verify

      - name: Prepare build artifact
        run: |
          mkdir -p build
          SRC=com.microsoft.copilot.eclipse.repository/target/com.microsoft.copilot.eclipse.repository-${COPILOT_PLUGIN_VERSION}.zip
          if [ ! -f "$SRC" ]; then
            echo "ERROR: Expected ZIP not found at $SRC"
            ls -la com.microsoft.copilot.eclipse.repository/target || true
            exit 1
          fi
          find build/ -maxdepth 1 -name "github-copilot-eclipse-anypoint-*.zip" -delete 2>/dev/null || true
          OUT=build/github-copilot-eclipse-anypoint-${COPILOT_PLUGIN_VERSION}.zip
          cp -f "$SRC" "$OUT"
          sha256sum "$OUT" | awk '{print $1 "  " $2}' > "${OUT}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: github-copilot-for-anypoint-${{ env.COPILOT_PLUGIN_VERSION }}
          path: |
            build/*.zip
            build/*.sha256

