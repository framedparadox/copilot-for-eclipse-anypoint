name: Build and Package (p2 ZIP)

on:
  push:
    branches: [ build ]
  workflow_dispatch:

env:
  MAVEN_OPTS: -Xmx2g
  TIMESTAMP: ${{ github.run_number }}-${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'

      - name: Cache Maven local repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Build (Tycho/Maven)
        run: |
          ./mvnw -DskipTests -Dcheckstyle.skip=true clean verify

      - name: Prepare build artifact
        run: |
          mkdir -p build
          SRC=com.microsoft.copilot.eclipse.repository/target/com.microsoft.copilot.eclipse.repository-0.18.0-SNAPSHOT.zip
          if [ ! -f "$SRC" ]; then
            echo "ERROR: Expected ZIP not found at $SRC"
            ls -la com.microsoft.copilot.eclipse.repository/target || true
            exit 1
          fi
          OUT=build/github-copilot-eclipse-anypoint-${TIMESTAMP}.zip
          cp -f "$SRC" "$OUT"
          sha256sum "$OUT" | awk '{print $1 "  " $2}' > "${OUT}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: copilot-anypoint-zip-${{ github.run_number }}
          path: |
            build/*.zip
            build/*.sha256

