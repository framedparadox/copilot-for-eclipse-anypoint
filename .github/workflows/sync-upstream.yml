name: Sync from Upstream

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/microsoft/copilot-for-eclipse.git
          git fetch upstream main --no-tags

      - name: Check for upstream changes
        id: check
        run: |
          COUNT=$(git rev-list --count HEAD..upstream/main)
          echo "new_commits=$COUNT" >> $GITHUB_OUTPUT
          if [ "$COUNT" -gt 0 ]; then
            echo "Found $COUNT new commit(s) from upstream."
          else
            echo "Already up to date with upstream."
          fi

      - name: Ensure sync branch exists
        if: steps.check.outputs.new_commits != '0'
        run: |
          if ! git ls-remote --exit-code origin refs/heads/sync > /dev/null 2>&1; then
            echo "Creating sync branch from current main..."
            git checkout -b sync
            git push origin sync
            git checkout main
          fi

      - name: Collect upstream change summary
        if: steps.check.outputs.new_commits != '0'
        id: changes
        run: |
          {
            echo "summary<<EOF"
            git log HEAD..upstream/main --oneline | head -30 | sed 's/^/- /'
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Merge upstream into main
        if: steps.check.outputs.new_commits != '0'
        run: |
          if ! git merge upstream/main --no-edit; then
            echo "::error::Merge conflict with upstream. Manual resolution required."
            git merge --abort
            exit 1
          fi
          git push origin main

      - name: Create or update PR to sync
        if: steps.check.outputs.new_commits != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: |
            ## Upstream Sync

            **${{ steps.check.outputs.new_commits }} new commit(s)** from [`microsoft/copilot-for-eclipse`](https://github.com/microsoft/copilot-for-eclipse) have been merged into `main`.

            ### Changes
            ${{ steps.changes.outputs.summary }}

            ---
            _Review and merge to bring the `sync` branch up to date with upstream._
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr-body.md
          EXISTING=$(gh pr list \
            --base sync --head main \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Updating existing PR #$EXISTING"
            gh pr edit "$EXISTING" \
              --title "chore: sync ${{ steps.check.outputs.new_commits }} upstream commit(s) from microsoft/copilot-for-eclipse" \
              --body-file /tmp/pr-body.md
          else
            gh pr create \
              --base sync \
              --head main \
              --title "chore: sync ${{ steps.check.outputs.new_commits }} upstream commit(s) from microsoft/copilot-for-eclipse" \
              --body-file /tmp/pr-body.md
          fi
