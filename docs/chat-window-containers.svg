<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Copilot Chat Window Container Map</title>
  <desc id="desc">Diagram showing the SWT container hierarchy for the GitHub Copilot chat window.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fa; }
      .title { fill: #111827; font: 700 28px Arial, sans-serif; }
      .subtitle { fill: #4b5563; font: 400 15px Arial, sans-serif; }
      .section-title { fill: #111827; font: 700 16px Arial, sans-serif; }
      .label { fill: #111827; font: 700 14px Arial, sans-serif; }
      .small { fill: #374151; font: 400 12px Arial, sans-serif; }
      .mono { fill: #4b5563; font: 400 12px "SFMono-Regular", Consolas, monospace; }
      .root { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 8; }
      .top { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; rx: 7; }
      .content { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; rx: 7; }
      .turn { fill: #ffffff; stroke: #10b981; stroke-width: 1.3; rx: 6; }
      .input { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; rx: 7; }
      .handoff { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; rx: 7; }
      .state { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.4; rx: 7; }
      .agent { fill: #fdf2f8; stroke: #db2777; stroke-width: 1.4; rx: 7; }
      .muted { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.2; rx: 6; }
      .line { stroke: #6b7280; stroke-width: 1.4; fill: none; }
      .dash { stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 6 5; fill: none; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="980"/>
  <text class="title" x="48" y="54">GitHub Copilot Chat Window Containers</text>
  <text class="subtitle" x="48" y="80">SWT hierarchy, CSS IDs/classes, and optional runtime containers</text>

  <rect class="root" x="48" y="110" width="760" height="818"/>
  <text class="section-title" x="72" y="142">Chat root</text>
  <text class="mono" x="72" y="162">Composite owned by ChatView · #chat-container</text>

  <rect class="top" x="78" y="186" width="700" height="62"/>
  <text class="label" x="102" y="214">TopBanner</text>
  <text class="mono" x="102" y="234">#chat-top-banner · header/title row</text>

  <line class="line" x1="428" y1="248" x2="428" y2="274"/>

  <rect class="content" x="78" y="274" width="700" height="370"/>
  <text class="label" x="102" y="304">Content Wrapper</text>
  <text class="mono" x="102" y="324">Composite · #chat-content-wrapper</text>

  <rect class="content" x="108" y="350" width="640" height="250"/>
  <text class="label" x="132" y="378">ChatContentViewer</text>
  <text class="mono" x="132" y="398">#chat-content-viewer · scrollable conversation</text>

  <rect class="muted" x="138" y="424" width="580" height="144"/>
  <text class="label" x="162" y="451">cmpContent</text>
  <text class="mono" x="162" y="470">inner Composite · receives turns and errors</text>

  <rect class="turn" x="168" y="492" width="240" height="48"/>
  <text class="label" x="188" y="520">UserTurnWidget</text>
  <text class="mono" x="188" y="536">SWTBot: user-turn</text>

  <rect class="turn" x="438" y="492" width="250" height="48"/>
  <text class="label" x="458" y="520">CopilotTurnWidget</text>
  <text class="mono" x="458" y="536">SWTBot: copilot-turn</text>

  <rect class="muted" x="138" y="570" width="580" height="18"/>

  <rect class="state" x="108" y="614" width="640" height="22"/>
  <text class="small" x="128" y="630">Alternate pages in this wrapper: AfterLoginWelcomeViewer, AgentModeViewer, ChatHistoryViewer</text>

  <line class="line" x1="428" y1="644" x2="428" y2="670"/>

  <rect class="handoff" x="78" y="670" width="700" height="86"/>
  <text class="label" x="102" y="700">HandoffContainer</text>
  <text class="mono" x="102" y="720">optional · #chat-container &gt; HandoffContainer</text>
  <rect class="muted" x="520" y="690" width="220" height="44"/>
  <text class="small" x="540" y="716">buttonsContainer</text>
  <text class="mono" x="540" y="730">HandoffButtonWidget rows</text>

  <line class="line" x1="428" y1="756" x2="428" y2="782"/>

  <rect class="input" x="78" y="782" width="700" height="118"/>
  <text class="label" x="102" y="810">ActionBar</text>
  <text class="mono" x="102" y="830">#chat-action-bar-wrapper · chat input stack</text>
  <rect class="muted" x="108" y="848" width="142" height="34"/>
  <text class="small" x="126" y="869">StaticBanner</text>
  <rect class="muted" x="266" y="848" width="130" height="34"/>
  <text class="small" x="286" y="869">TodoListBar</text>
  <rect class="muted" x="412" y="848" width="148" height="34"/>
  <text class="small" x="431" y="869">WorkingSetBar</text>
  <rect class="input" x="576" y="846" width="172" height="38"/>
  <text class="small" x="596" y="869">#chat-action-bar</text>

  <rect class="input" x="78" y="908" width="700" height="0" opacity="0"/>

  <rect class="input" x="848" y="110" width="384" height="260"/>
  <text class="section-title" x="872" y="142">Inside #chat-action-bar</text>
  <rect class="muted" x="878" y="166" width="324" height="44"/>
  <text class="label" x="898" y="192">cmpFileRef</text>
  <text class="mono" x="898" y="206">AddContextButton, CurrentReferencedFile</text>
  <rect class="muted" x="878" y="226" width="324" height="44"/>
  <text class="label" x="898" y="252">ChatInputTextViewer</text>
  <text class="mono" x="898" y="266">editable input text widget</text>
  <rect class="muted" x="878" y="286" width="324" height="54"/>
  <text class="label" x="898" y="312">cmpActionArea</text>
  <text class="mono" x="898" y="326">cmpControlBar + bottomRightButtonsComposite</text>

  <rect class="agent" x="848" y="402" width="384" height="270"/>
  <text class="section-title" x="872" y="434">Agent/Subagent Containers</text>
  <rect class="muted" x="878" y="458" width="324" height="42"/>
  <text class="label" x="898" y="484">ThinkingTurnWidget</text>
  <text class="mono" x="898" y="498">base for streamed thinking</text>
  <rect class="muted" x="878" y="516" width="324" height="42"/>
  <text class="label" x="898" y="542">ThinkingBlock / ThinkingSection</text>
  <text class="mono" x="898" y="556">reasoning display containers</text>
  <rect class="muted" x="878" y="574" width="324" height="68"/>
  <text class="label" x="898" y="600">SubagentMessageBlock</text>
  <text class="mono" x="898" y="614">.subagent-message-block</text>
  <text class="mono" x="898" y="630">contentArea → SubagentTurnWidget</text>

  <rect class="state" x="848" y="704" width="384" height="184"/>
  <text class="section-title" x="872" y="736">State Pages</text>
  <text class="small" x="878" y="766">Direct under #chat-container:</text>
  <text class="mono" x="898" y="788">LoadingViewer</text>
  <text class="mono" x="898" y="808">BeforeLoginWelcomeViewer</text>
  <text class="mono" x="898" y="828">NoSubscriptionViewer</text>
  <text class="small" x="878" y="856">Under #chat-content-wrapper:</text>
  <text class="mono" x="898" y="878">AfterLoginWelcomeViewer · AgentModeViewer · ChatHistoryViewer</text>

  <path class="dash" d="M 778 862 C 825 862, 830 250, 878 250"/>
  <path class="dash" d="M 688 516 C 790 516, 790 604, 878 604"/>
  <path class="dash" d="M 748 625 C 805 625, 805 790, 878 790"/>

  <text class="subtitle" x="48" y="958">Source: docs/CHAT_WINDOW_CONTAINERS.md and com.microsoft.copilot.eclipse.ui chat SWT classes</text>
</svg>
